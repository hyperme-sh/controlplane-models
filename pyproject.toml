[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanopticon-models"
version = "0.2.0"
requires-python = ">=3.13"
description = "Shared Pydantic v2 domain contracts (cross-service / events / ACL)"
dependencies = [
    "pydantic[email]>=2.12.0",
    "solana>=0.36.0",
]

[project.optional-dependencies]
grpc = [
    "controlplane-proto @ git+https://github.com/hyperme-sh/controlplane-proto.git@4ce51c3492d1f7d7c85fb8322f7eefda059209f2",
    "mcp<2",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=6.33.6",
    "pydantic-rpc>=0.15.2",
    "pydantic-rpc-cli>=0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spanopticon_models"]

[tool.hatch.build.targets.sdist]
include = ["src/spanopticon_models"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
