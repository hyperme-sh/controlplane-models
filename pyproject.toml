[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panopticon-models"
version = "0.1.0"
requires-python = ">=3.13"
description = "Shared Pydantic v2 domain contracts (cross-service / events / ACL)"
dependencies = [
    "pydantic[email]>=2.12.0",
    "solana>=0.36.0",
]

[project.optional-dependencies]
grpc = [
    "controlplane-proto>=0.1.0",
    "mcp<2",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=6.33.6",
    "pydantic-rpc>=0.15.2",
    "pydantic-rpc-cli>=0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panopticon_models"]

[tool.hatch.build.targets.sdist]
include = ["src/panopticon_models"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
controlplane-proto = { git = "ssh://git@github.com/FyberLabs/controlplane-proto.git", rev = "4a91308fcd2a5589d1ab9f82fd7917f6afb655d4" }
