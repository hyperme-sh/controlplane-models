[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panopticon-models"
version = "0.1.0"
requires-python = ">=3.13"
description = "Shared Pydantic v2 domain contracts (cross-service / Kafka / ACL)"
dependencies = [
    "pydantic[email]>=2.12.0",
    "solana>=0.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panopticon_models"]

[tool.hatch.build.targets.sdist]
include = ["src/panopticon_models"]
