name: Component checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Disposable hosted workers have no route into the shared private runner fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Prepare job-local build output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/models-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.26
          python-version: '3.13'
          enable-cache: false
      - name: Qualify public protocol dependency without inherited credentials
        run: >-
          bash scripts/anonymous-command.sh env
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" bash scripts/check.sh --grpc
      - name: Prepare and inspect GHCR consumer image
        run: >-
          bash scripts/anonymous-command.sh env
          QUALIFIED_DIST_DIR="$RELEASE_ARTIFACT_DIR"
          GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID"
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          bash scripts/check-container.sh
      - name: Remove job-local build output
        if: always()
        run: rm -rf -- "$RELEASE_ARTIFACT_DIR"
